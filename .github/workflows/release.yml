name: Build & Release

on:
  push:
    tags: ['v*']      # ex.: git tag v1.0.0 && git push --tags
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build (Release)
        run: dotnet build src/SpaceInvaders/SpaceInvaders.csproj -c Release -o dist

      - name: Empacotar
        run: Compress-Archive -Path dist\* -DestinationPath SpaceInvaders-win.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SpaceInvaders-win
          path: SpaceInvaders-win.zip

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SpaceInvaders-win.zip
